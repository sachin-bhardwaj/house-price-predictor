apiVersion: v1
kind: Service
metadata:
  name: house-price-model-service
spec:
  type: NodePort
  selector:
    app: house-price-model
  ports:
    - protocol: TCP
      port: 8000          # Port exposed by the service inside the cluster
      targetPort: 8000    # Port on the container
      nodePort: 30100     # Port exposed on the node
