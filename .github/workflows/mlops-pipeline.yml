name: Mlops pipeline

on:
  workflow_dispatch:
    inputs:
      run_all:
        required: false
        default: 'true'
      run_data-processing:
        default: 'false'
      run_ model-training:
        default: 'false'
      run_Build-&-publish-image:
        default: 'false'

jobs:
  data-preprocessing:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Running Data preprocessing script
        run: |
          python src/data/run_processing.py \
            --input data/raw/house_data.csv \
            --output data/processed/cleaned_house_data.csv

      - name: Running feature engineering script
        run: |
          python src/features/engineer.py \
           --input data/processed/cleaned_house_data.csv \
           --output data/processed/featured_house_data.csv \
           --preprocessor models/trained/preprocessor.pkl

      - name: Upload processed data
        uses: actions/upload-artifact@v4
        with:
          name: processed-data(csv)
          path: data/processed/cleaned_house_data.csv

      - name: Upload preprocessor (pkl file)
        uses: actions/upload-artifact@v4
        with:
          name: preprocessor
          path: models/trained/preprocessor.pkl

  model-training:
    needs: data-preprocessing
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Download processed data artifact
        uses: actions/download-artifact@v5

      - name: Setup mlflow
        run: | 
          docker pull ghcr.io/mlflow/mlflow:latest
          docker run -d -p 5555:5000 --name mlflow-server ghcr.io/mlflow/mlflow:latest \
          mlflow server --host 0.0.0.0 --backend-store-uri sqlite:///mlflow.db --default-artifact-root /tmp/mlruns
          sleep 20
          docker ps -a
          docker exec mlflow-server mlflow --version

      - name: wait for mlflow to start
        run: |
          for i in {1..10}; do
          curl -f http://localhost:5000/health || sleep 20;
          done

      - name: train model
        run: |
          mkdir -p models
          python src/models/train_model.py \
            --config configs/model_config.yaml \
            --data data/processed/featured_house_data.csv \
            --models-dir models  --mlflow-tracking-uri http://localhost:5555

      - name: Upload trained model
        uses: actions/upload-artifact@v4
        with:
          name: trained-model
          path: models/

      - name: Clean up mlflow
        run: |
          docker stop mlflow-server || true
          docker rm mlflow-server || true

  Build-and-publish-image:
    needs: model-training
    runs-on: ubuntu-latest
    steps:

      - name: Checkout code
        uses: actions/checkout@v5

      - name : download trained model
        uses: actions/download-artifact@v5
        with:
          name: trained-model
          path: models/
      
      - name: download preprocessor (pickle) file 
        uses: actions/download-artifact@v5
        with:
          name: preprocessor
          path: models/trained/

      -  name: Login to Docker Hub
         uses: docker/login-action@v3
         with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: setup docker buildx
        uses: docker/setup-buildx-action@v3

      -  name: Build and push
         uses: docker/build-push-action@v6
         with:
            push: true
            tags: bhardwajsachin866/house-price-model:${{ github.sha }}
            context: "."
            file: "Dockerfile"



        

